name: CI

on:
  push:
    branches:
      - main
      - pickleball-mvp
      - pickleball-mvp-gemini
      - development
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Fast Static & Unit Tests (No DB required, ~30-45s)
  # -------------------------------------------------------------
  fast-checks:
    name: Lint, Typecheck & Fast Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Code Quality (ESLint)
        run: npm run lint

      - name: Typecheck (TypeScript)
        run: npm run typecheck

      - name: Unit & Component Tests (Vitest)
        run: npm test

      - name: Matchmaking Fairness & Simulation Suite
        run: npm run test:simulation

  # -------------------------------------------------------------
  # Job 2: Integration & Maintenance Tests (Runs in parallel with Job 1 & 3)
  # -------------------------------------------------------------
  integration:
    name: Integration & Maintenance Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 54322:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:54322/postgres
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:54322/test_db
      ORGANIZER_SESSION_SECRET: ci-secret-that-is-at-least-thirty-two-bytes-long-now
      ORGANIZER_FINGERPRINT_SECRET: ci-fingerprint-secret-at-least-thirty-two-bytes
      SESSION_COOKIE_SECURE: "false"
      SETUP_TOKEN: ci-setup-token

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Maintenance CLI Permissions and Transaction Tests
        run: npm run test:maintenance
        env:
          MAINTENANCE_TEST_ADMIN_URL: postgresql://postgres@127.0.0.1:54322/postgres

      - name: Setup Test Database
        run: node scripts/create-test-db.js

      - name: Run Database Migrations
        run: |
          npm run db:migrate
          DATABASE_URL="$TEST_DATABASE_URL" npm run db:migrate

      - name: Integration Tests (Database & Server Actions)
        run: npm run test:integration

  # -------------------------------------------------------------
  # Job 3: Build & End-to-End Acceptance Tests (Playwright)
  # -------------------------------------------------------------
  e2e:
    name: Build & End-to-End Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 54322:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:54322/postgres
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:54322/test_db
      ORGANIZER_SESSION_SECRET: ci-secret-that-is-at-least-thirty-two-bytes-long-now
      ORGANIZER_FINGERPRINT_SECRET: ci-fingerprint-secret-at-least-thirty-two-bytes
      SESSION_COOKIE_SECURE: "false"
      SETUP_TOKEN: ci-setup-token

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Test Database
        run: node scripts/create-test-db.js

      - name: Run Database Migrations
        run: |
          npm run db:migrate
          DATABASE_URL="$TEST_DATABASE_URL" npm run db:migrate

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers (Cache Miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS Dependencies (Cache Hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Production Build (Next.js)
        run: npm run build

      - name: End-to-End Acceptance & Accessibility Tests
        run: npm run test:e2e

  # -------------------------------------------------------------
  # Job 4: Release Gate / Summary (Matches branch protection checks)
  # -------------------------------------------------------------
  verify:
    name: Lint, Test, Simulation, and Release Gates
    needs: [fast-checks, integration, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check Status of All Pipeline Jobs
        run: |
          if [ "${{ needs.fast-checks.result }}" != "success" ] || \
             [ "${{ needs.integration.result }}" != "success" ] || \
             [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed successfully!"
